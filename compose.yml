services:
  backend:
    image: ${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_TAG}
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      # Override DATABASE_URL to use the Docker service hostname instead of localhost
      DATABASE_URL: postgresql://parkflow:parkflow@db:5432/parkflow
      PORT: 3001
      OAUTH_TOKEN_URL: ${OAUTH_TOKEN_URL:-https://sso.matheo.si/application/o/token/}
      AUTHENTIK_USERINFO_URL: ${AUTHENTIK_USERINFO_URL:-https://sso.matheo.si/application/o/userinfo/}
      AUTHENTIK_ADMIN_GROUP: ${AUTHENTIK_ADMIN_GROUP:-parkflow-admins}
      # Public frontend URL used for the Rocket.Chat bot's map deep-links
      PUBLIC_FRONTEND_URL: ${PUBLIC_FRONTEND_URL:-https://parkflow.matheo.si}
    ports:
      - '3001:3001'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - parkflow

  frontend:
    image: ${CI_REGISTRY_IMAGE}/frontend:${CI_COMMIT_TAG}
    restart: unless-stopped
    ports:
      - '80:3000'
    depends_on:
      - backend
    networks:
      - parkflow

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: parkflow
      POSTGRES_USER: parkflow
      POSTGRES_PASSWORD: parkflow
    volumes:
      - parkflow_db:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U parkflow']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - parkflow

  reminders-cron:
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      - backend
    # Reads REMINDER_TRIGGER_TOKEN from the same backend/.env the backend uses —
    # single source of truth, no GitLab CI var or root .env needed.
    env_file:
      - backend/.env
    environment:
      - TZ=Europe/Ljubljana
      - BACKEND_URL=http://backend:3001
    entrypoint:
      - /bin/sh
      - -c
      - |
        apk add --no-cache curl tzdata >/dev/null
        # $$ escapes Compose interpolation so the CONTAINER shell expands these
        # from backend/.env / environment. With a single $, Compose substitutes
        # them from the (empty) deploy shell at parse time → empty token + URL.
        printf '35 7 * * 1-5 curl -fsS -X POST -H "X-Reminder-Token: %s" %s/api/internal/reminders/run\n' "$$REMINDER_TRIGGER_TOKEN" "$$BACKEND_URL" > /etc/crontabs/root
        # 15:00 Fridays (TZ above) — nudge every spot owner to free their spot.
        printf '0 15 * * 5 curl -fsS -X POST -H "X-Reminder-Token: %s" %s/api/internal/reminders/owners/run\n' "$$REMINDER_TRIGGER_TOKEN" "$$BACKEND_URL" >> /etc/crontabs/root
        crond -f -l 2
    networks:
      - parkflow

networks:
  parkflow:
    driver: bridge

volumes:
  parkflow_db:
    driver: local
