services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    pull_policy: build
    restart: always
    env_file:
      - backend/.env
    environment:
      # Override DATABASE_URL to use the Docker service hostname instead of localhost
      DATABASE_URL: postgresql://parkflow:parkflow@db:5432/parkflow
      PORT: 3001
    ports:
      - '3001:3001'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - parkflow

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
        VITE_OAUTH_AUTHORITY: ${VITE_OAUTH_AUTHORITY:-https://sso.matheo.si/application/o/park-flow}
        VITE_OAUTH_CLIENT_ID: ${VITE_OAUTH_CLIENT_ID:-V9RNWkqNeQq8FhnTCxnPr3hhlQLoBXHkp0k8k95j}
        VITE_OAUTH_REDIRECT_URI: ${VITE_OAUTH_REDIRECT_URI:-http://localhost/callback}
        VITE_OAUTH_ADMIN_GROUP: ${VITE_OAUTH_ADMIN_GROUP:-parkflow-admins}
    pull_policy: build
    restart: always
    ports:
      - '80:3000'
    depends_on:
      - backend
    networks:
      - parkflow

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: parkflow
      POSTGRES_USER: parkflow
      POSTGRES_PASSWORD: parkflow
    volumes:
      - parkflow_db:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U parkflow']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - parkflow

networks:
  parkflow:
    driver: bridge

volumes:
  parkflow_db:
    driver: local
