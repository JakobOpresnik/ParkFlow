services:
  backend:
    image: ${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_TAG}
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      # Override DATABASE_URL to use the Docker service hostname instead of localhost
      DATABASE_URL: postgresql://parkflow:parkflow@db:5432/parkflow
      PORT: 3001
      OAUTH_TOKEN_URL: ${OAUTH_TOKEN_URL:-https://sso.matheo.si/application/o/token/}
      AUTHENTIK_USERINFO_URL: ${AUTHENTIK_USERINFO_URL:-https://sso.matheo.si/application/o/userinfo/}
      AUTHENTIK_ADMIN_GROUP: ${AUTHENTIK_ADMIN_GROUP:-parkflow-admins}
      # Public frontend URL used for the Rocket.Chat bot's map deep-links
      PUBLIC_FRONTEND_URL: ${PUBLIC_FRONTEND_URL:-https://parkflow.matheo.si}
      # Shared secret for the Rocket.Chat Outgoing WebHook (set in CI/CD secrets)
      ROCKETCHAT_WEBHOOK_TOKEN: ${ROCKETCHAT_WEBHOOK_TOKEN:-}
    ports:
      - '3001:3001'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - parkflow

  frontend:
    image: ${CI_REGISTRY_IMAGE}/frontend:${CI_COMMIT_TAG}
    restart: unless-stopped
    ports:
      - '80:3000'
    depends_on:
      - backend
    networks:
      - parkflow

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: parkflow
      POSTGRES_USER: parkflow
      POSTGRES_PASSWORD: parkflow
    volumes:
      - parkflow_db:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U parkflow']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - parkflow

networks:
  parkflow:
    driver: bridge

volumes:
  parkflow_db:
    driver: local
