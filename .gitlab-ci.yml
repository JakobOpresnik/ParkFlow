include:
  - component: ${CI_SERVER_FQDN}/pub/gitlab-ci-templates/gitlab-ci-local@~latest
  - component: ${CI_SERVER_FQDN}/pub/gitlab-ci-templates/secret-detection@~latest
    inputs:
      stage: security
  - component: ${CI_SERVER_FQDN}/pub/gitlab-ci-templates/trivy@~latest
    inputs:
      stage: security
      repository: true
  - component: ${CI_SERVER_FQDN}/pub/gitlab-ci-templates/docker-multi-build@~latest
    rules:
      - if: $CI_COMMIT_TAG
      - if: $CI_COMMIT_BRANCH == 'main'
    inputs:
      stage: build
      buildList:
        - IMAGE_NAME: backend
          CONTEXT_PATH: backend
          DOCKER_FILE: backend/Dockerfile
        - IMAGE_NAME: frontend
          CONTEXT_PATH: frontend
          DOCKER_FILE: frontend/Dockerfile
   - component: ${CI_SERVER_FQDN}/pub/gitlab-ci-templates/env-helper@~latest
  - component: ${CI_SERVER_FQDN}/pub/gitlab-ci-templates/ssh-helper@~latest
  - component: ${CI_SERVER_FQDN}/pub/gitlab-ci-templates/git-helper@~latest
  - component: ${CI_SERVER_FQDN}/pub/gitlab-ci-templates/docker-compose@~latest

stages:
  - security
  - test
  - lint
  - build
  - deploy

variables:
  # Dependency-Track integration used by trivy template job `repo_sbom_upload`.
  # Set these in GitLab CI/CD variables (project/group):
  # - DEPENDENCY_TRACK_API_URL (example: https://dependency-track.example.com/api/v1/bom)
  # - DEPENDENCY_TRACK_API_KEY
  # - DEPENDENCY_TRACK_PROJECT_ID (UUID)
  MATHEO_DT_API: $DEPENDENCY_TRACK_API_URL
  MATHEO_DT_API_KEY: $DEPENDENCY_TRACK_API_KEY
  DT_PROJECT_ID: $DEPENDENCY_TRACK_PROJECT_ID

default:
  image: oven/bun:1.2.22

backend_test:
  stage: test
  variables:
    NODE_ENV: test
    DATABASE_URL: postgresql://localhost:5432/postgres
    JWT_SECRET: test-secret
  script:
    - cd backend
    - bun install --frozen-lockfile
    - bun run test
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH

backend_lint:
  stage: lint
  script:
    - cd backend
    - bun install --frozen-lockfile
    - bunx tsc -p tsconfig.json --noEmit
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH

frontend_lint:
  stage: lint
  script:
    - cd frontend
    - bun install --frozen-lockfile
    - bun run lint
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH

compose_dockerfile_guard:
  stage: lint
  script:
    - |
      grep -q 'dockerfile: Dockerfile.dev' docker-compose.dev.yml
      test "$(grep -c 'dockerfile: Dockerfile.dev' docker-compose.dev.yml)" -eq 2
      grep -q 'dockerfile: Dockerfile' docker-compose.yml
      test "$(grep -c 'dockerfile: Dockerfile' docker-compose.yml)" -eq 2
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH

frontend_build:
  stage: build
  script:
    - cd frontend
    - bun install --frozen-lockfile
    - bun run build
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH

backend_container_build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ''
  script:
    - docker build -f backend/Dockerfile backend
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == 'main'
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH

frontend_container_build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ''
  script:
    - docker build -f frontend/Dockerfile frontend
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == 'main'
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH

deploy_production:
  stage: deploy
  image: cr.matheo.si/pub/alpine-runner
  before_script:
    - !reference [.ssh_helper, load]
    - !reference [.env_helper, load]
  script:
    - !reference [.git_helper, git_clone_or_pull]
    - !reference [.docker-compose, deploy]
  environment:
    name: production
  variables:
    CI_SSH_HOST: parkflow.int.matheo.si
    CI_SSH_USER: deploy
    CI_SSH_PORT: '22'
    SSH_PRIVATE_KEY: $SSH_PRIVATE_KEY
    DEPLOY_DIR: /home/parkflow
    CI_COMPOSE_FILE: compose.yml
  rules:
     - if: $CI_COMMIT_TAG
