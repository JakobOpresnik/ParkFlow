services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: parkflow
      POSTGRES_PASSWORD: parkflow
      POSTGRES_DB: parkflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Migrations run automatically on first start (alphabetical order = correct)
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U parkflow']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    pull_policy: build
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://parkflow:parkflow@db:5432/parkflow
      PORT: 3001
      OAUTH_TOKEN_URL: ${OAUTH_TOKEN_URL:-https://sso.matheo.si/application/o/token/}
      AUTHENTIK_USERINFO_URL: ${AUTHENTIK_USERINFO_URL:-https://sso.matheo.si/application/o/userinfo/}
      AUTHENTIK_ADMIN_GROUP: ${AUTHENTIK_ADMIN_GROUP:-parkflow-admins}
      TIMESHEET_API_URL: ${TIMESHEET_API_URL:-https://timesheet.abelium.com/api}
    ports:
      - '3001:3001'
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
        VITE_OAUTH_AUTHORITY: ${VITE_OAUTH_AUTHORITY:-https://sso.matheo.si/application/o/park-flow}
        VITE_OAUTH_CLIENT_ID: ${VITE_OAUTH_CLIENT_ID:-V9RNWkqNeQq8FhnTCxnPr3hhlQLoBXHkp0k8k95j}
        VITE_OAUTH_REDIRECT_URI: ${VITE_OAUTH_REDIRECT_URI:-http://localhost:5173/callback}
        VITE_OAUTH_ADMIN_GROUP: ${VITE_OAUTH_ADMIN_GROUP:-parkflow-admins}
    pull_policy: build
    environment:
      # Browser reaches backend via the host — keep localhost:3001
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
      VITE_OAUTH_AUTHORITY: ${VITE_OAUTH_AUTHORITY:-https://sso.matheo.si/application/o/park-flow}
      VITE_OAUTH_CLIENT_ID: ${VITE_OAUTH_CLIENT_ID:-V9RNWkqNeQq8FhnTCxnPr3hhlQLoBXHkp0k8k95j}
      VITE_OAUTH_REDIRECT_URI: ${VITE_OAUTH_REDIRECT_URI:-http://localhost:5173/callback} # override with http://localhost/callback for port 80
      VITE_OAUTH_ADMIN_GROUP: ${VITE_OAUTH_ADMIN_GROUP:-parkflow-admins}
    ports:
      - '5173:3000'
    depends_on:
      - backend

  reminders-cron:
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      - backend
    # Reads REMINDER_TRIGGER_TOKEN from the same gitignored backend/.env the
    # backend uses — single source of truth, no GitLab CI var or root .env needed.
    env_file:
      - ./backend/.env
    environment:
      - TZ=Europe/Ljubljana
      - BACKEND_URL=http://backend:3001
    entrypoint:
      - /bin/sh
      - -c
      - |
        apk add --no-cache curl tzdata >/dev/null
        printf '35 7 * * 1-5 curl -fsS -X POST -H "X-Reminder-Token: %s" %s/api/internal/reminders/run\n' "$REMINDER_TRIGGER_TOKEN" "$BACKEND_URL" > /etc/crontabs/root
        crond -f -l 2

volumes:
  postgres-data:
